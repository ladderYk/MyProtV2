# MyProt V2 — 持续集成 (ADR-0013)
#
# 三条独立通道, 覆盖项目承诺的"双构建系统 + 双平台":
#   linux   : CMake + GCC  -> 6 个单测 + E2E (362 例)
#   windows : MSBuild + MSVC -> scripts/ci.ps1 的全部可执行测试 (与本地门禁同一套逻辑)
#   webui   : Vitest 单测 + Vite 生产构建
#
# 说明:
#   * 仓库主构建是 VS2015 (v140) 的 .sln; hosted runner 不预装 v140,
#     因此 Windows 通道用 /p:PlatformToolset=v143 覆盖工具集, 只验证源码与工程文件,
#     不改变开发者本地的 v140 构建链 (ADR-0010)。
#   * WebUI smoke (scripts/webui-smoke.ps1) 依赖 Edge + 本地产物, 不在 CI 中运行,
#     由开发者本地 `scripts\ci.ps1` 覆盖。

name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / CMake + GCC
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-linux -j"$(nproc)"

      - name: Unit tests + E2E
        run: ctest --test-dir build-linux --output-on-failure

  windows:
    name: Windows / MSBuild
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release x64)
        run: msbuild MyProt.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m /v:m

      # -SkipBuild: 产物已在上一步生成; -SkipWebUI: 前端由独立 job 负责。
      - name: Unit tests + E2E
        shell: powershell
        run: ./scripts/ci.ps1 -SkipBuild -SkipWebUI

  webui:
    name: WebUI / Vitest + Vite
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
